name: Build iOS IPA (Free Sideload)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile iOS IPA (No $99 Apple Account)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild iOS Native Project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Verify iOS Project Structure
        run: |
          ls -la ios
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          echo "Found workspace: $WORKSPACE"
          if [ -z "$WORKSPACE" ]; then
            echo "Error: No .xcworkspace found in ios/"
            exit 1
          fi

      - name: Build iOS Application (Unsigned Release Archive)
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag{gsub(/^[ \t]+/, ""); print; exit}')
          echo "Archiving workspace: $WORKSPACE with scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ToolKit.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA format for Sideloadly / AltStore
        run: |
          echo "Listing applications in archive:"
          ls -la build/ToolKit.xcarchive/Products/Applications/
          mkdir -p Payload
          cp -R build/ToolKit.xcarchive/Products/Applications/*.app Payload/
          zip -qr ToolKit.ipa Payload
          rm -rf Payload
          ls -lh ToolKit.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToolKit-iOS-IPA
          path: ToolKit.ipa
          retention-days: 14

      - name: Create or Update GitHub Release with Direct IPA Download
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ios-latest
          name: "ToolKit iOS Latest (Unsigned IPA for Sideloadly)"
          body: |
            ## 📱 ToolKit iOS IPA (Cài đặt trên iPhone không cần tài khoản 99$)
            - File IPA này dùng để cài vào iPhone cá nhân bằng **Sideloadly** trên máy tính Windows.
            - Không cần mua tài khoản Apple Developer 99$.
            - Tải file `ToolKit.ipa` bên dưới và làm theo hướng dẫn cài đặt.
          files: ToolKit.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
