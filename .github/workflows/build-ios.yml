name: Build iOS IPA (Free Sideload)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ipa:
    name: Compile iOS IPA (No $99 Apple Account)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild iOS Native Project
        run: npx expo prebuild --platform ios --clean

      - name: Build iOS Application (Unsigned Release)
        run: |
          xcodebuild -workspace ios/ToolKit.xcworkspace \
            -scheme ToolKit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            clean build

      - name: Package into IPA format for Sideloadly / AltStore
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ToolKit.app Payload/
          zip -qr ToolKit.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToolKit-iOS-IPA
          path: ToolKit.ipa
          retention-days: 14
